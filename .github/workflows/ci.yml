# Continuous Integration - Run tests and linting
name: CI

on:
  push:
    branches:
      - main
      - master
  # Deliberately no branch filter. With `branches: [main, master]` here, a pull
  # request whose base is any other branch -- which is how a change is stacked on
  # another unmerged change -- got no CI at all, and "no checks reported" in the
  # PR list reads much like "checks passed". Every pull request runs CI.
  pull_request:

env:
  # fastembed model cache (bge-small ~130 MB; shared across jobs)
  FASTEMBED_CACHE_PATH: /home/runner/.cache/fastembed

jobs:
  # The workflow files are the one thing here with no other gate, and release.yml
  # is the part that runs rarely and matters most -- so a mistake in it is found
  # at release time, by everyone. actionlint reads the workflows themselves:
  # expression syntax, job-graph references, and the shell and Python inside each
  # `run:` block, through shellcheck and pyflakes, both of which the pinned image
  # below ships. Run against this tree it reported two SC2086 findings in
  # release.yml (`>> $GITHUB_OUTPUT` unquoted); both are fixed.
  actionlint:
    name: Lint workflows
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run actionlint
        uses: docker://rhysd/actionlint:1.7.12
        with:
          args: -color

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      # --all-extras, not --extra dev. The cloud SDKs are imported conditionally,
      # so with them absent mypy reports "cannot find implementation or library
      # stub" and types the calls against `Any` -- which is how a `temperature`
      # argument the Anthropic SDK had already removed passed type checking while
      # raising TypeError at runtime for every user of docugraph[cloud].
      - name: Sync dependencies
        run: uv sync --all-extras

      # `scripts/` is included, not just `src/`. The live-provider smoke script is
      # not part of the package but it is part of this repository, and code no gate
      # reads is code that rots. mypy gets both paths together so it resolves
      # `docugraph` to this source tree rather than to the installed copy, which it
      # otherwise reports as an untyped library. `tests/` is linted by ruff only:
      # tests are not shipped, and their unused arguments are fixtures by design
      # (see the per-file ignore in pyproject.toml).
      - name: Run Ruff linter
        run: uv run ruff check src/ scripts/ tests/

      - name: Run Ruff formatter check
        run: uv run ruff format --check src/ scripts/ tests/

      - name: Run mypy
        run: uv run mypy src/ scripts/

      # These SDKs are installed in this job and nowhere else in CI, so it is the
      # only place the cloud request shapes can be checked against the real
      # libraries rather than against their absence. Skips itself if anthropic
      # is missing, which is why it belongs to the all-extras job.
      - name: Check the cloud provider calls against the installed SDKs
        run: uv run pytest tests/unit/test_cloud_provider_sdks.py -v

  test:
    name: Test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      # Report every version, rather than cancelling the others when one fails.
      fail-fast: false
      matrix:
        # Every version the package claims, via the pyproject classifiers, now
        # that 3.13 is among them. 3.14 is excluded by `requires-python`; the
        # comment there gives the two independent reasons.
        python-version: ['3.11', '3.12', '3.13']
    env:
      # uv otherwise reads .python-version (3.11) and silently builds a 3.11
      # venv for both legs, so the matrix would prove nothing. This overrides
      # that file for every uv command in the job, `uv run` included.
      UV_PYTHON: ${{ matrix.python-version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      # `--extra cloud` as well as dev, so the whole suite runs with the SDKs
      # present. Without it the two `importorskip("openai")` tests in
      # tests/unit/test_embeddings.py skipped here -- and they ran nowhere else,
      # because the all-extras job runs only tests/unit/test_cloud_provider_sdks.py.
      # One of the two is the guard on the auto-embedding fix: a key in the
      # environment must not be read as a request to send documents to OpenAI.
      # A regression guard that never runs is a comment.
      #
      # `ollama` is deliberately not included: no test imports it, and the three
      # ollama tests in tests/unit/test_llm_preflight.py monkeypatch the probe.
      #
      # `crawl` and `graph` are the extras that used to be core dependencies. A
      # normal install now leaves them out, so the full-profile leg has to name
      # them to keep running every test that needs them.
      - name: Sync dependencies
        run: uv sync --extra dev --extra crawl --extra graph --extra cloud

      - name: Cache fastembed models
        uses: actions/cache@v4
        with:
          path: /home/runner/.cache/fastembed
          key: fastembed-bge-small-en-v1.5

      - name: Run tests
        run: uv run pytest tests/unit/ tests/integration/ tests/e2e/ -v --tb=short

  # The same full profile on x86_64 macOS. The wheels this package depends on
  # (onnxruntime, lancedb, pyarrow, kuzu) each drop Intel-macOS builds at their
  # own pace; a Linux-only matrix cannot see that, and the caps' comments say
  # an install on this platform is the condition for lifting them.
  test-macos:
    name: Test (macOS py${{ matrix.python-version }})
    runs-on: macos-15-intel
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    env:
      UV_PYTHON: ${{ matrix.python-version }}
      FASTEMBED_CACHE_PATH: /Users/runner/.cache/fastembed

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Sync dependencies
        run: uv sync --all-extras

      - name: Cache fastembed models
        uses: actions/cache@v4
        with:
          path: /Users/runner/.cache/fastembed
          key: fastembed-bge-small-en-v1.5-macos

      - name: Run tests
        run: uv run pytest tests/unit/ tests/integration/ tests/e2e/ -v --tb=short

  # The minimal profile: what `pip install docugraph` actually installs. The
  # same test files run here; tests that need an extra are marked by
  # tests/conftest.py and deselected, while the blocked-child tests still run
  # because they simulate the absent extras themselves.
  test-minimal:
    name: Test (minimal py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    env:
      UV_PYTHON: ${{ matrix.python-version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Sync dependencies
        run: uv sync --extra dev

      - name: Cache fastembed models
        uses: actions/cache@v4
        with:
          path: /home/runner/.cache/fastembed
          key: fastembed-bge-small-en-v1.5

      - name: Build the wheel
        run: uv build

      # A shipped package that cannot be typed or read is not ready. Both are
      # read from the built artifact, not from pyproject: the build is what the
      # user installs.
      - name: Inspect the wheel
        run: |
          python3 - <<'PY'
          import pathlib, sys, zipfile

          wheels = list(pathlib.Path("dist").glob("docugraph-*.whl"))
          if len(wheels) != 1:
              sys.exit(f"expected one wheel, found {wheels!r}")
          with zipfile.ZipFile(wheels[0]) as wheel:
              names = wheel.namelist()
              if "docugraph/py.typed" not in names:
                  sys.exit("docugraph/py.typed is missing from the wheel")
              metadata = next(n for n in names if n.endswith(".dist-info/METADATA"))
              text = wheel.read(metadata).decode("utf-8")

          fields = [line for line in text.splitlines() if line.startswith(("License-Expression:", "License:"))]
          if "License-Expression: Apache-2.0" not in fields:
              sys.exit(f"wheel has no License-Expression: Apache-2.0; found {fields!r}")
          if any(line.startswith("License:") for line in fields):
              sys.exit("wheel carries a legacy License: field alongside the expression")
          if any(line.startswith("Classifier: License ::") for line in text.splitlines()):
              sys.exit("wheel still carries a License :: classifier")
          print(f"wheel: {wheels[0].name}")
          print("py.typed: present")
          print(f"licence: {'; '.join(fields)}")
          PY

      # Every classifier must be a real Trove value. A typo here is invisible
      # to pip and to the index -- it just never matches a filter.
      - name: Validate classifier names
        run: |
          uv run --no-project --with trove-classifiers python - <<'PY'
          import pathlib, sys, tomllib
          import trove_classifiers

          project = tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]
          unknown = [c for c in project["classifiers"] if c not in trove_classifiers.classifiers]
          if unknown:
              sys.exit(f"unknown Trove classifiers: {unknown!r}")
          print(f"classifiers: {len(project['classifiers'])} known")
          PY

      - name: Run tests
        run: uv run pytest tests/ -m "not requires_extras" -v

      # A4/A3t: the built wheel, installed into a throwaway environment, must
      # import and report a version -- with every extra requested, so the
      # extras are exercised rather than merely declared.
      - name: Install the wheel with every extra
        if: matrix.python-version == '3.11'
        run: |
          WHEEL=$(ls dist/docugraph-*.whl)
          uv run --no-project --with "${WHEEL}[all]" python -c "import docugraph; print(docugraph.__version__)"

  test-minimal-macos:
    name: Test (minimal macOS py${{ matrix.python-version }})
    runs-on: macos-15-intel
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    env:
      UV_PYTHON: ${{ matrix.python-version }}
      FASTEMBED_CACHE_PATH: /Users/runner/.cache/fastembed

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Sync dependencies
        run: uv sync --extra dev

      - name: Cache fastembed models
        uses: actions/cache@v4
        with:
          path: /Users/runner/.cache/fastembed
          key: fastembed-bge-small-en-v1.5-macos

      - name: Run tests
        run: uv run pytest tests/ -m "not requires_extras" -v

  docker:
    # Builds the image but never publishes it: docker-publish.yml owns pushing,
    # and that only triggers on a tag. This job exists so a dependency change
    # cannot break the image without anyone noticing between releases.
    name: Docker (production image)
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build the production target
        run: docker build --file docker/Dockerfile --target production --tag docugraph:ci .

      - name: Handshake over stdio
        # Initialise, then let stdin close. A missing LLM does not stop the
        # server from identifying itself -- that is the point of the
        # degradation work -- so this needs no credentials.
        run: |
          printf '%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05","capabilities":{},"clientInfo":{"name":"ci-handshake","version":"0"}}}' \
            | timeout 300 docker run -i --rm docugraph:ci \
                > /tmp/handshake.jsonl 2> /tmp/handshake.err \
            || echo "docker run exit: $?"
          echo "--- container stderr (tail) ---"
          tail -20 /tmp/handshake.err || true

      - name: Assert the handshake
        run: |
          python3 - <<'PY'
          import json, pathlib, sys, tomllib

          # Read the expected version from pyproject.toml rather than pinning a
          # literal. pyproject is the single source of the version -- the
          # package, the CLI and this handshake all derive from it -- so a
          # hardcoded constant only goes stale at the next release, which is
          # exactly how it broke: it stayed "0.1.1" into the 0.2.0 release.
          EXPECTED = tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"]
          raw = pathlib.Path("/tmp/handshake.jsonl").read_text()

          # stdout carries the JSON-RPC stream and nothing else. A stray line
          # here corrupts the protocol, so it fails rather than being skipped.
          messages = []
          for n, line in enumerate(raw.splitlines(), 1):
              if not line.strip():
                  continue
              try:
                  messages.append(json.loads(line))
              except json.JSONDecodeError as e:
                  sys.exit(f"stdout line {n} is not JSON: {line[:160]!r} ({e})")

          infos = [
              m["result"]["serverInfo"]
              for m in messages
              if isinstance(m.get("result"), dict) and "serverInfo" in m["result"]
          ]
          if not infos:
              sys.exit(f"no serverInfo in {len(messages)} message(s): {messages!r}")
          if infos[0].get("version") != EXPECTED:
              sys.exit(f"serverInfo.version is {infos[0].get('version')!r}, expected {EXPECTED!r}")

          print(f"stdout: {len(messages)} JSON-RPC message(s), 0 stray lines")
          print(f"serverInfo: {infos[0]}")
          PY

  # The browser rows need a real Chromium, which the matrix job does not
  # install -- so they skipped everywhere and their guards were never
  # exercised in CI. Here they run, and DOCUGRAPH_REQUIRE_BROWSER=1 makes a
  # missing browser a failure instead of a skip: "nothing ran" must not look
  # like "everything passed". The same switch is what turns a broken install
  # into a red build rather than a green one with no coverage.
  integration-browser:
    name: Integration (browser)
    runs-on: ubuntu-latest
    needs: lint
    env:
      DOCUGRAPH_REQUIRE_BROWSER: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Sync dependencies
        run: uv sync --all-extras

      - name: Install Chromium
        run: uv run playwright install chromium --with-deps

      - name: Run integration tests
        run: uv run pytest tests/integration -v

  # The browser guards are bound to Playwright's routing API, which is the same
  # on macOS but installed differently (`--with-deps` is Debian/Ubuntu-only).
  # Without this leg the crawl extra's supported platform is asserted, not run.
  integration-browser-macos:
    name: Integration (browser, macOS)
    runs-on: macos-15-intel
    needs: lint
    env:
      DOCUGRAPH_REQUIRE_BROWSER: "1"
      FASTEMBED_CACHE_PATH: /Users/runner/.cache/fastembed

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Sync dependencies
        run: uv sync --all-extras

      - name: Cache fastembed models
        uses: actions/cache@v4
        with:
          path: /Users/runner/.cache/fastembed
          key: fastembed-bge-small-en-v1.5-macos

      - name: Install Chromium
        run: uv run playwright install chromium

      - name: Run integration tests
        run: uv run pytest tests/integration -v

  # ---------------------------------------------------------------------------
  # LadybugDB (opt-in backend, WP-docugraph-0.4.0 §3.5)
  #
  # Three jobs, and only these three, are added for the Ladybug backend. Every
  # job above still tests the Kùzu default unchanged.
  #
  # `graph_db` is set through `DOCUGRAPH_STORAGE__GRAPH_DB` in the tests that
  # need the backend (their fixtures set it), not once for the whole job: each
  # of those tests also needs its own data directory and FTS cache, and a
  # global value would leak into Kùzu-specific tests. The setting itself —
  # parsing, the default, and the refusal of an unknown value — is covered by
  # tests/unit/test_graph_backend_config.py in this job.
  #
  # The full-text-search extension is a separate download. The step below
  # resolves the pinned URL and digest for this runner's platform, re-verifies
  # a digest-keyed cache, and downloads the file when the cache is cold. A
  # platform with no pin is a hard failure: the backend cannot start without
  # the extension, so a leg that cannot obtain it proves nothing.
  graph-ladybug:
    name: Graph (Ladybug, ${{ matrix.os }} py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        # Every platform this release claims. `macos-15` is arm64; the
        # `osx_arm64` pin in fts_pins.py stands or falls with this leg. No
        # Linux arm64 leg is claimed: there is no runner here to exercise it,
        # so that platform stays unpinned and unsupported.
        os: [ubuntu-latest, macos-15-intel, macos-15]
        python-version: ['3.11', '3.13']
    env:
      UV_PYTHON: ${{ matrix.python-version }}
      FASTEMBED_CACHE_PATH: ${{ runner.temp }}/fastembed
      DOCUGRAPH_STORAGE__DATA_DIR: ${{ runner.temp }}/docugraph-data

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Sync dependencies
        run: uv sync --extra dev --extra graph --extra ladybug

      - name: Resolve the pinned FTS artifact
        id: fts-pin
        run: |
          uv run python - <<'PY' >> "$GITHUB_OUTPUT"
          from docugraph.storage import fts, fts_pins

          compat = fts.compat_version()
          plat = fts.platform_key()
          pin = fts_pins.PINS.get((compat, plat))
          if pin is None:
              raise SystemExit(
                  f"no FTS pin for ladybug {fts.package_version()} on {plat!r}; "
                  "this platform cannot be claimed"
              )
          print(f"platform={plat}")
          print(f"sha256={pin['sha256']}")
          PY

      - name: Cache the verified FTS extension
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/docugraph-data/extensions/fts
          key: fts-${{ steps.fts-pin.outputs.platform }}-${{ steps.fts-pin.outputs.sha256 }}

      # A cache hit still has its bytes checked against the pin: the key names
      # the expected digest, but the cache is not trusted to have preserved it.
      # A miss, or a mismatch, downloads the pinned URL and verifies that.
      - name: Fetch and verify the FTS extension
        run: |
          uv run python - <<'PY'
          import os
          from pathlib import Path

          from docugraph.storage import fts, fts_pins

          data_dir = Path(os.environ["DOCUGRAPH_STORAGE__DATA_DIR"])
          pin = fts_pins.PINS[(fts.compat_version(), fts.platform_key())]
          target = fts.cache_path(data_dir)
          if target.exists() and fts.sha256_file(target) == pin["sha256"]:
              path = target
              print(f"FTS artifact: cache hit, digest verified ({path})")
          else:
              path = fts.fetch_fts(data_dir)
              print(f"FTS artifact: downloaded and verified ({path})")

          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as fh:
              fh.write(f"DOCUGRAPH_TEST_FTS_ARTIFACT={path}\n")
          PY

      # Only tests that drive Ladybug. A Kùzu database in this process would
      # make the Ladybug extension unimportable (the two bindings register the
      # same C++ type names, and neither can be undone), so the migration tests
      # live in their own job and the Kùzu graph tests in the Kùzu jobs.
      - name: Run the graph tests on Ladybug
        run: |
          uv run pytest --ladybug-only \
            tests/integration/test_ladybug_driver.py \
            tests/integration/test_graph_ladybug.py \
            tests/unit/test_fts_manifest.py \
            -v

  # graphiti's own parameterized tests, run against docugraph's driver. This is
  # the check that Ladybug behaves like Kùzu where graphiti can tell: the same
  # 25 tests that pass on Kùzu v0.30.2 must pass unchanged through
  # LadybugDriver. The stand-in is installed at import time by a pytest plugin;
  # no graphiti file is edited, and `kuzu` is never imported.
  graphiti-conformance-ladybug:
    name: Graphiti conformance (Ladybug)
    runs-on: ubuntu-latest
    needs: lint
    env:
      PYTHONPATH: ${{ github.workspace }}/tests/conformance
      DOCUGRAPH_LADYBUG_CONFORMANCE: "1"
      # graphiti's conftest imports every driver's test helpers, and
      # `helpers_test.py` imports FalkorDriver (needs `falkordb`) and Neo4j
      # unless told otherwise. This job runs only the Kùzu provider family, so
      # turn the others off; without these the baseline step fails at
      # collection with "falkordb is required for FalkorDriver".
      DISABLE_FALKORDB: "1"
      DISABLE_NEO4J: "1"
      ENABLE_KUZU: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Sync dependencies
        run: uv sync --extra dev --extra graph --extra ladybug

      - name: Check out graphiti v0.30.2
        run: |
          git clone --depth 1 --branch v0.30.2 \
            https://github.com/getzep/graphiti.git "$RUNNER_TEMP/graphiti"

      # Step 3 of §3.5: the run must go through docugraph's driver. A pass that
      # came from graphiti's own Kùzu driver would prove nothing.
      - name: Assert the run uses docugraph's driver
        run: uv run pytest tests/conformance/test_routing.py -p ladybug_plugin -v

      # Only the baseline IDs are run, so there is no "expected failure" to
      # ignore: every collected test must pass. The same set is then checked
      # from the JUnit XML, which also catches a test that silently failed to
      # collect (a collected-out test is absent from the XML).
      - name: Run the Kùzu-pass baseline under LadybugDriver
        working-directory: ${{ runner.temp }}/graphiti
        run: |
          tr '\n' '\0' < "$GITHUB_WORKSPACE/tests/conformance/kuzu_pass_ids.txt" \
            | xargs -0 "$GITHUB_WORKSPACE/.venv/bin/python" -m pytest \
                -p ladybug_plugin --junitxml="$RUNNER_TEMP/graphiti-ladybug.xml" -q
          "$GITHUB_WORKSPACE/.venv/bin/python" \
            "$GITHUB_WORKSPACE/tests/conformance/check_results.py" \
            "$RUNNER_TEMP/graphiti-ladybug.xml"

  # §3.5 step 4 of the worked example: an existing Kùzu graph, migrated, then
  # read through the Ladybug backend. Counts per table and three fixed searches
  # have to survive the copy.
  migration-ladybug:
    name: Migration (Kùzu → Ladybug)
    runs-on: ubuntu-latest
    needs: lint
    env:
      DOCUGRAPH_STORAGE__DATA_DIR: ${{ runner.temp }}/docugraph-data

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Sync dependencies
        run: uv sync --extra dev --extra graph --extra ladybug

      - name: Resolve the pinned FTS artifact
        id: fts-pin
        run: |
          uv run python - <<'PY' >> "$GITHUB_OUTPUT"
          from docugraph.storage import fts, fts_pins

          pin = fts_pins.PINS.get((fts.compat_version(), fts.platform_key()))
          if pin is None:
              raise SystemExit("no FTS pin for this platform; cannot run")
          print(f"platform={fts.platform_key()}")
          print(f"sha256={pin['sha256']}")
          PY

      - name: Cache the verified FTS extension
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/docugraph-data/extensions/fts
          key: fts-${{ steps.fts-pin.outputs.platform }}-${{ steps.fts-pin.outputs.sha256 }}

      - name: Fetch and verify the FTS extension
        run: |
          uv run python - <<'PY'
          import os
          from pathlib import Path

          from docugraph.storage import fts, fts_pins

          data_dir = Path(os.environ["DOCUGRAPH_STORAGE__DATA_DIR"])
          pin = fts_pins.PINS[(fts.compat_version(), fts.platform_key())]
          target = fts.cache_path(data_dir)
          if target.exists() and fts.sha256_file(target) == pin["sha256"]:
              path = target
              print(f"FTS artifact: cache hit, digest verified ({path})")
          else:
              path = fts.fetch_fts(data_dir)
              print(f"FTS artifact: downloaded and verified ({path})")

          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as fh:
              fh.write(f"DOCUGRAPH_TEST_FTS_ARTIFACT={path}\n")
          PY

      - name: Run the migration tests
        run: uv run pytest tests/integration/test_graph_migration.py -v

  test-summary:
    name: Test Summary
    runs-on: ubuntu-latest
    # Every result is read, not just listed: a job in `needs` that is never
    # checked still lets a red leg print "All tests passed!".
    needs:
      - test
      - test-macos
      - test-minimal
      - test-minimal-macos
      - integration-browser
      - integration-browser-macos
      - graph-ladybug
      - graphiti-conformance-ladybug
      - migration-ladybug
    if: always()

    steps:
      - name: Check test results
        run: |
          failed=0
          check() {
            echo "$1: $2"
            [ "$2" = "success" ] || failed=1
          }
          check test "${{ needs.test.result }}"
          check test-macos "${{ needs['test-macos'].result }}"
          check test-minimal "${{ needs['test-minimal'].result }}"
          check test-minimal-macos "${{ needs['test-minimal-macos'].result }}"
          check integration-browser "${{ needs['integration-browser'].result }}"
          check integration-browser-macos "${{ needs['integration-browser-macos'].result }}"
          check graph-ladybug "${{ needs['graph-ladybug'].result }}"
          check graphiti-conformance-ladybug "${{ needs['graphiti-conformance-ladybug'].result }}"
          check migration-ladybug "${{ needs['migration-ladybug'].result }}"
          if [ "$failed" -eq 0 ]; then
            echo "All tests passed!"
          else
            echo "Some tests failed"
            exit 1
          fi
