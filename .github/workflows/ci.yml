# Continuous Integration - Run tests and linting
name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

env:
  # fastembed model cache (bge-small ~130 MB; shared across jobs)
  FASTEMBED_CACHE_PATH: /home/runner/.cache/fastembed

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Sync dependencies
        run: uv sync --extra dev

      - name: Run Ruff linter
        run: uv run ruff check src/

      - name: Run Ruff formatter check
        run: uv run ruff format --check src/

      - name: Run mypy
        run: uv run mypy src/

  test:
    name: Test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      # Report every version, rather than cancelling the others when one fails.
      fail-fast: false
      matrix:
        # Every version the package claims, via the pyproject classifiers.
        python-version: ['3.11', '3.12']
    env:
      # uv otherwise reads .python-version (3.11) and silently builds a 3.11
      # venv for both legs, so the matrix would prove nothing. This overrides
      # that file for every uv command in the job, `uv run` included.
      UV_PYTHON: ${{ matrix.python-version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Sync dependencies
        run: uv sync --extra dev

      - name: Cache fastembed models
        uses: actions/cache@v4
        with:
          path: /home/runner/.cache/fastembed
          key: fastembed-bge-small-en-v1.5

      - name: Run tests
        run: uv run pytest tests/unit/ tests/integration/ tests/e2e/ -v --tb=short

  test-summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: test
    if: always()

    steps:
      - name: Check test results
        run: |
          if [ "${{ needs.test.result }}" == "success" ]; then
            echo "All tests passed!"
          else
            echo "Some tests failed"
            exit 1
          fi
