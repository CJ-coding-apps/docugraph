# Continuous Integration - Run tests and linting
name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: |
          uv pip install --system ruff mypy

      - name: Run Ruff linter
        run: ruff check src/

      - name: Run Ruff formatter check
        run: ruff format --check src/

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build test image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile
          target: development
          load: true
          tags: docugraph-test:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run unit tests
        run: |
          docker run --rm \
            -v ${{ github.workspace }}/tests:/app/tests:ro \
            --entrypoint python \
            docugraph-test:latest \
            -m pytest tests/unit/ -v --tb=short

      - name: Run integration tests
        run: |
          docker run --rm \
            -v ${{ github.workspace }}/tests:/app/tests:ro \
            --entrypoint python \
            docugraph-test:latest \
            -m pytest tests/integration/ -v --tb=short

      - name: Run E2E tests
        run: |
          docker run --rm \
            -v ${{ github.workspace }}/tests:/app/tests:ro \
            --entrypoint python \
            docugraph-test:latest \
            -m pytest tests/e2e/ -v --tb=short

  test-summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: test
    if: always()

    steps:
      - name: Check test results
        run: |
          if [ "${{ needs.test.result }}" == "success" ]; then
            echo "All tests passed!"
          else
            echo "Some tests failed"
            exit 1
          fi
