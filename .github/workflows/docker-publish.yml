# Build and publish Docker images to GitHub Container Registry
name: Docker Publish

on:
  # Manual only. Publishing a release goes through release.yml, which builds the
  # same production image and tags it with the release version; a `v*` tag used
  # to fire this file as well, building that image a second time under a second
  # set of tags. Branch pushes deliberately do not trigger it either: an image
  # for every push to main is noise, and it made the first push to a new
  # repository fail a multi-platform build before anything was released.
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # ghcr.io requires a lowercase repository path, and `github.repository`
      # keeps the owner's case. Expressions have no lowercase function, so it
      # is done in the shell. `docker/metadata-action` lowercases the `images:`
      # input itself, but the tags built by hand below are not, so they all read
      # the same resolved value.
      - name: Resolve image name
        id: image
        run: echo "name=${REGISTRY}/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      # The arm64 half of the multi-platform build runs under emulation on the
      # amd64 runners, which requires QEMU registered with binfmt. Without this
      # step the arm64 build fails.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            # The tag as pushed (v1.2.3)
            type=ref,event=tag
            # Semver components (1.2.3, 1.2, 1)
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            # Short SHA, so a manual run is traceable
            type=sha,prefix=sha-
            # `latest` only for a version tag, never for a manual run
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./docker/Dockerfile
          target: production
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64

      - name: Build and push development image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./docker/Dockerfile
          target: development
          push: true
          tags: ${{ steps.image.outputs.name }}:dev
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64
