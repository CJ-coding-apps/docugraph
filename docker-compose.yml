# DocuGraph AI v1 - Root Docker Compose
# Convenience wrapper for docker/docker-compose.yml
#
# Usage:
#   docker-compose run cli crawl https://example.com
#   docker-compose run cli index local /path/to/docs
#   docker-compose run cli search "my query"
#   # MCP stdio server (not a compose service — run it directly):
#   docker run -i --rm -v docugraph-data:/data/docugraph \
#     $(docker-compose build -q cli) docugraph-mcp

version: '3.8'

services:
  cli:
    extends:
      file: docker/docker-compose.yml
      service: cli

volumes:
  docugraph-data:
    driver: local
