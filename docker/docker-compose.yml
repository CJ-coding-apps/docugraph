# DocuGraph AI v1 - Docker Compose Configuration
#
# Usage:
#   Bootstrap an index into the shared volume:
#     docker-compose run --rm cli index local /path/to/docs
#   Run the MCP stdio server for Claude Code:
#     docker run -i --rm -v docugraph-data:/data/docugraph \
#       $(docker-compose build -q cli) docugraph-mcp
#
# The MCP server speaks stdio — it is not a compose service (ports don't
# apply); clients spawn it with `docker run -i` and speak JSON-RPC over
# stdin/stdout.
#
# For macOS x86_64 (Intel Macs) where LanceDB has no native wheels,
# this is the recommended development approach.

version: '3.8'

services:
  # ===========================================
  # DocuGraph CLI (index bootstrap + one-off commands)
  # ===========================================
  cli:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: development
    container_name: docugraph-cli
    volumes:
      - ../src:/app/src:ro
      - ../tests:/app/tests:ro
      - ../pyproject.toml:/app/pyproject.toml:ro
      - docugraph-data:/data/docugraph
      - ~/.docugraph:/home/docugraph/.docugraph:ro
    environment:
      - DOCUGRAPH_STORAGE__DATA_DIR=/data/docugraph
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
    profiles:
      - cli  # Only start when explicitly requested
    entrypoint: ["docugraph"]
    command: ["--help"]

volumes:
  docugraph-data:
    driver: local
