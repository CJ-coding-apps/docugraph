[project]
name = "docugraph"
version = "0.5.0"
description = "Documentation RAG for coding agents: vector search, knowledge graph, agent memory, and an MCP server — torch-free local embeddings via fastembed"
readme = "README.md"
# The ceiling is deliberate, and two different dependency groups supply the two
# independent reasons for it.
#
# Reason 1, the `graph` extra: `kuzu==0.11.3` (pinned below) publishes cp314
# wheels for Linux only -- its macOS and Windows wheels stop at cp313. On those
# platforms 3.14 resolves to the 19 MB sdist, and pip tries to compile Kuzu's C++
# from source.
#
# Reason 2, core: fastembed requires `onnxruntime>=1.24.2` on 3.14, while this
# package caps onnxruntime below 1.24. Those two cannot both be satisfied, so on
# 3.14 this package cannot be installed anywhere at all, Linux included.
#
# Declaring the ceiling turns both into one clear line from pip, before anything
# is downloaded. It lifts only when the Kuzu pin and the onnxruntime cap are
# revisited together; both are recorded in the project's open decisions.
requires-python = ">=3.11,<3.14"
# PEP 639: an SPDX expression, and no `License ::` classifier restating it.
license = "Apache-2.0"
authors = [{ name = "Jim Cuttler", email = "jimcuttler@gmail.com" }]
keywords = ["rag", "knowledge-graph", "vector-search", "coding-agent", "mcp", "documentation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development",
    "Topic :: Software Development :: Documentation",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# A core install is the local index/search tool: embeddings, the vector store,
# the MCP server and the CLI. The browser stack (`crawl`) and the graph database
# (`graph`) are extras -- a user who never crawls a page or builds a knowledge
# graph should not download a headless browser or an archived C++ database.
dependencies = [
    # Core
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "pyyaml>=6.0",
    "rich>=13.7.0",

    # Embeddings + reranking (local, pure ONNX — no torch)
    # (<0.9: fastembed 0.9 moved to a model API this code does not use yet;
    # lift only after the embedding tests pass against it on every supported
    # platform.)
    "fastembed>=0.4.0,<0.9",
    # (onnxruntime <1.24: newer releases dropped macOS x86_64 wheels; lift only
    # after a --no-build install succeeds on macOS 15 x86_64.)
    "onnxruntime<1.24",

    # Vector Database (<0.26: newer releases dropped macOS x86_64 wheels)
    "lancedb>=0.6.0,<0.26",
    # (<26: pyarrow 26 is newer than anything LanceDB has been tested against
    # here; lift together with the LanceDB cap, not alone.)
    "pyarrow>=15.0.0,<26",
    # (<4: pandas 3 changed copy-on-write and dtypes; nothing here needs the new
    # behaviour, so the next major arrives deliberately.)
    "pandas>=2.0.0,<4",

    # CLI
    "click>=8.1.0",

    # MCP Protocol (<2: the 2.x SDK removed the low-level Server
    # list_tools/call_tool decorators mcp_server.py is built on)
    "mcp>=1.0.0,<2",

    # Utilities
    "httpx>=0.27.0",
    "aiofiles>=23.2.0",
    "tenacity>=8.2.0",
    "xxhash>=3.4.0",
]

[project.urls]
Homepage = "https://github.com/CJ-coding-apps/docugraph"
Repository = "https://github.com/CJ-coding-apps/docugraph"
Issues = "https://github.com/CJ-coding-apps/docugraph/issues"
Changelog = "https://github.com/CJ-coding-apps/docugraph/blob/main/CHANGELOG.md"
Security = "https://github.com/CJ-coding-apps/docugraph/security/policy"

[project.optional-dependencies]
# Web Crawling
# The guards are bound to crawl4ai 0.9.x's hook table and to Playwright's
# routing API. crawl4ai is capped below the next minor because the hook and
# retry surfaces the guards pin are not a compatibility promise; Playwright's
# floor is route_web_socket (1.48, Playwright's own docs), and the cap is the
# next minor above the version CI installs. A browser job must be green on the
# new version before either cap lifts.
crawl = [
    "crawl4ai>=0.9.3,<0.10",
    "playwright>=1.48,<1.63",
]

# Knowledge Graph
# Pinned exactly, to the version this code was tested against. graphiti-core
# moves quickly, and an open range let a future release change its Kùzu
# requirement -- or drop the kuzu driver -- and break the install against the
# exact `kuzu` pin below, with no change here to explain it. Do not widen
# without re-running the ingestion tests against the new version.
graph = [
    "graphiti-core[kuzu]==0.30.2",
    # Pinned exactly: kuzu is archived upstream (0.11.3 is the final release) and
    # its file format is not stable pre-1.0, so an unpinned upgrade can make an
    # existing graph unreadable. graphiti-core[kuzu] requires kuzu>=0.11.3, so
    # this pin is compatible. Do not widen it without a migration step.
    "kuzu==0.11.3",
]

# LadybugDB backend (opt-in; Kùzu remains the default).
# The floor is the version whose binding rule and FTS artifact were measured
# (WP-0.4.0 Phase 0, 2026-11-08). The cap is the next minor: the FTS artifact
# URL embeds the extension compatibility version, and the checksums pinned in
# src/docugraph/storage/fts_pins.py belong to 0.22.x. A newer minor needs a new
# pin and a green `Graph (Ladybug)` CI run before this range moves.
ladybug = [
    "ladybug>=0.22.3,<0.23",
]

# Cloud LLM providers.
#
# Each is capped below the next major version -- the one above what CI installs
# and tests against -- so a major release cannot arrive as an automatic install
# in someone's environment. The Anthropic 1.x SDK removed `temperature` from its
# request type and broke every call until it was removed here; the same class of
# change in any of these three would break a user's build with nothing in this
# repo to explain it. Lifting a cap is a deliberate edit with a test run behind
# it, not a Dependabot PR.
cloud = [
    "openai>=1.12.0,<4",
    "anthropic>=0.18.0,<2",
    "cohere>=5.0.0,<8",
]

# Local LLM via Ollama
ollama = [
    "ollama>=0.1.0",
]

# Development
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.16.0",
    "mypy>=1.8.0",
    "pre-commit>=3.6.0",
    "types-pyyaml",
]

# All optional dependencies a *user* of the package would want. `dev` is
# deliberately not among them: it installs pytest, ruff, mypy and pre-commit,
# which serve contributors rather than callers, and pulling them into a normal
# install is not a thing to offer. CI still installs `dev` -- `uv sync
# --all-extras` covers every extra, `dev` included -- so nothing is tested less
# for its absence here.
all = [
    "docugraph[crawl,graph,cloud,ollama]",
]

[project.scripts]
docugraph = "docugraph.interfaces.cli:main"
docugraph-mcp = "docugraph.interfaces.mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/docugraph"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "ARG",    # flake8-unused-arguments
    "SIM",    # flake8-simplify
    "TID251", # flake8-tidy-imports: banned-api
]
ignore = ["E501", "B008", "B904"]

[tool.ruff.lint.per-file-ignores]
# Unused arguments in tests are fixtures and stub signatures by design: a
# fixture is requested by name, and a fake must match the real call shape.
"tests/**" = ["ARG001", "ARG002", "ARG005"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
# get_event_loop() is wrong in both directions: it returns no loop at all once
# anything in the process has called asyncio.run(), and inside a running loop it
# hands back a loop that cannot be driven with run_until_complete. Neither
# failure looks like a loop problem from the caller's side, which is how three
# separate copies of this pattern survived here. Await in async code;
# asyncio.run(...) in sync code.
"asyncio.get_event_loop".msg = "Await the async implementation, or use asyncio.run(...) from sync code."

[tool.ruff.lint.isort]
known-first-party = ["docugraph"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = [
    "lancedb.*",
    "crawl4ai.*",
    "graphiti_core.*",
    "fastembed.*",
    "mcp.*",
    "pyarrow.*",
    "pandas.*",
]
ignore_missing_imports = true

# Optional extras: packages only present when the user installs cloud/ollama.
[[tool.mypy.overrides]]
module = [
    "ollama.*",
    "cohere.*",
    "sentence_transformers.*",
    "anthropic.*",
]
ignore_missing_imports = true

# The MCP SDK's list_tools/call_tool decorators are untyped in the pinned
# release; don't penalize the handlers they wrap.
[[tool.mypy.overrides]]
module = "docugraph.interfaces.mcp_server"
disallow_untyped_decorators = false
disallow_untyped_calls = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --tb=short"
filterwarnings = [
    # A DeprecationWarning raised from docugraph's own code is a thing we can
    # fix, so it fails here rather than printing a line nobody reads. The
    # module field matches the frame the warning is attributed to, which for
    # `datetime.utcnow` and class-based Pydantic config is our file even though
    # the deprecation is upstream's. (Same rule CF applies to its own package.)
    "error::DeprecationWarning:docugraph",
    # graphiti-core warns on every KuzuDriver construction. Kuzu is deliberately
    # pinned (0.11.3, the final release) rather than migrated, so the warning is
    # accurate, unavoidable, and not ours to fix. Named so it stays narrow.
    "ignore:The Kuzu backend is deprecated.*:DeprecationWarning",
]

[tool.bandit]
exclude_dirs = ["tests", "examples"]
skips = ["B101"]  # Skip assert warnings (used in tests)
