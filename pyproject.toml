[project]
name = "docugraph-ai-v1"
version = "1.0.0"
description = "Documentation RAG for coding agents: vector search, knowledge graph, agent memory, and an MCP server — torch-free local embeddings via fastembed"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "DocuGraph AI Team" }]
keywords = ["rag", "knowledge-graph", "vector-search", "coding-agent", "mcp", "documentation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Documentation",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    # Core
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "pyyaml>=6.0",
    "rich>=13.7.0",

    # Embeddings + reranking (local, pure ONNX — no torch)
    # (onnxruntime <1.24: newer releases dropped macOS x86_64 wheels)
    "fastembed>=0.4.0",
    "onnxruntime<1.24",

    # Vector Database (<0.26: newer releases dropped macOS x86_64 wheels)
    "lancedb>=0.6.0,<0.26",
    "pyarrow>=15.0.0",
    "pandas>=2.0.0",

    # Knowledge Graph
    "graphiti-core[kuzu]>=0.5.0",

    # Web Crawling
    "crawl4ai>=0.7.8",

    # CLI
    "click>=8.1.0",
    "typer>=0.9.0",

    # MCP Protocol
    "mcp>=1.0.0",

    # Utilities
    "httpx>=0.27.0",
    "aiofiles>=23.2.0",
    "tenacity>=8.2.0",
    "xxhash>=3.4.0",
]

[project.optional-dependencies]
# Cloud LLM providers
cloud = [
    "openai>=1.12.0",
    "anthropic>=0.18.0",
    "cohere>=5.0.0",
]

# Local LLM via Ollama
ollama = [
    "ollama>=0.1.0",
]

# Development
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.3.0",
    "mypy>=1.8.0",
    "pre-commit>=3.6.0",
]

# All optional dependencies
all = [
    "docugraph-ai-v1[cloud,ollama,dev]",
]

[project.scripts]
docugraph = "docugraph.interfaces.cli:main"
docugraph-mcp = "docugraph.interfaces.mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/docugraph"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "ARG",    # flake8-unused-arguments
    "SIM",    # flake8-simplify
]
ignore = ["E501", "B008", "B904"]

[tool.ruff.lint.isort]
known-first-party = ["docugraph"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = [
    "lancedb.*",
    "crawl4ai.*",
    "graphiti_core.*",
    "fastembed.*",
    "mcp.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.bandit]
exclude_dirs = ["tests", "examples"]
skips = ["B101"]  # Skip assert warnings (used in tests)
